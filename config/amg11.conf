[PROFIBUS]
# Verbosidade do pyprofibus: 0 = silencioso. Use `run.py -v` para ligar o trace.
debug = 0

[PHY]
type = serial
dev = /dev/ttyUSB0
baud = 19200
rtscts = False
dsrdtr = False

[DP]
master_class = 1
master_addr = 1

[SLAVE_3]
name = AMG11
addr = 3
; caminho do GSD relativo a raiz do projeto (pyprofibus resolve pelo cwd)
gsd = gsd/PB13DPV0.gsd
sync_mode = False
freeze_mode = False
group_mask = 1
watchdog_ms = 1000
input_size = 2
output_size = 2
diag_period = 0
module_0 = 16 Bit Class 2 Encoder
